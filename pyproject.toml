[project]
name = "job-search-os"
version = "0.1.0"
description = "Single-user job search OS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobsearch-os = "jobsearch_os.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
